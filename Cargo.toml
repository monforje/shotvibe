[package]
name = "shotvibe"
version = "0.1.0"
edition = "2024"
description = "Lightshot-style screenshots and screen recording for GNOME on Wayland, built with GPUI"

[dependencies]
ab_glyph = "0.2.32"
anyhow = "1.0.104"
arboard = "3"
dirs = "7.0.0"
gpui = "0.2.2"
image = { version = "0.25", default-features = false, features = ["png"] }
libc = "0.2.190"
lyon = "1"
tiny-skia = "0.11"
zbus = "5"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true

# xattr 0.2.3 (via gpui -> zed-async-tar) references libc::ENOATTR, which newer libc dropped.
[patch.crates-io]
xattr = { path = "vendor/xattr" }
